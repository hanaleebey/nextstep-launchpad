project_id = "nextstep-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:8080", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"

# Every handler additionally verifies the caller with Supabase Auth getUser().
[functions.agent-estimate]
verify_jwt = true

[functions.moodle-connect]
verify_jwt = true

[functions.moodle-sync]
verify_jwt = true